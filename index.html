<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SEMF Nuclear Binding Energy Calculator</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1.5rem; max-width: 650px; }
    label { display: block; margin-top: 0.5rem; }
    input { width: 5rem; }
    .result { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Semi-Empirical Mass Formula (SEMF)</h1>
  <p>Enter Z (protons) and N (neutrons), then click “Calculate”.</p>

  <label>Z (protons): <input id="Z" type="number" value="1"></label>
  <label>N (neutrons): <input id="N" type="number" value="6"></label>
  <button onclick="calc()">Calculate</button>

  <div class="result" id="out"></div>

  <script>
    function pairing(A, Z, N) {
      if (A % 2 === 1) return 0;
      const evenZ = (Z % 2 === 0);
      const evenN = (N % 2 === 0);
      if (evenZ && evenN) return 12 / Math.sqrt(A);
      if (!evenZ && !evenN) return -12 / Math.sqrt(A);
      return 0;
    }

    function calc() {
      const Z = parseInt(document.getElementById('Z').value, 10);
      const N = parseInt(document.getElementById('N').value, 10);
      const A = Z + N;

      const a_v = 15.8;
      const a_s = 18.3;
      const a_c = 0.714;
      const a_a = 23.2;

      const volume   =  a_v * A;
      const surface  = -a_s * Math.pow(A, 2/3);
      const coulomb  = -a_c * Z * (Z - 1) / Math.pow(A, 1/3);
      const asym     = -a_a * Math.pow(A - 2*Z, 2) / A;
      const delta    = pairing(A, Z, N);

      const Ebind = volume + surface + coulomb + asym + delta;
      const perNucleon = Ebind / A;

      const out = document.getElementById('out');
      out.innerHTML =
        `A = ${A} (Z=${Z}, N=${N})<br>` +
        `Binding Energy ≈ ${Ebind.toFixed(2)} MeV<br>` +
        `Per nucleon ≈ ${perNucleon.toFixed(2)} MeV<br>` +
        (Ebind > 0
          ? '→ This nucleus is energetically allowed.'
          : '→ Binding energy is negative: nucleus cannot exist.');
    }
  </script>
</body>
</html>
